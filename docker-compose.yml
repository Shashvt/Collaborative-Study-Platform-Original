version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: csp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collab
      POSTGRES_USER: shashvtsharma
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shashvtsharma -d collab"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: csp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://shashvtsharma:password@postgres:5432/collab?sslmode=disable"
      FRONTEND_URL: "http://localhost:3000"
      AWS_REGION: "ap-southeast-2"
      AWS_BUCKET: "csp-vault-storage-2026"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "http://localhost:8080"
    container_name: csp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
