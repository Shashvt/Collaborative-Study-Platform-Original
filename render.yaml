services:
  - type: web
    name: csp-backend
    runtime: go
    rootDir: Backend
    buildCommand: go build -o server .
    startCommand: ./server
    envVars:
      - key: PORT
        value: 10000
      - key: GIN_MODE
        value: release
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: csp-db
          property: connectionString
      - key: FRONTEND_URL
        value: "*" # Set to your Vercel frontend URL once deployed
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_BUCKET
        value: csp-vault-storage-2026
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: csp-db
    databaseName: collab
    user: collab_user
    plan: free
